<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POST — Dashibodi ya daktari</title>
<meta name="theme-color" content="#f6f9fb">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2321716d'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='16' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
<style>
/* ===========================================================================
   Tokens — docs/DESIGN-SYSTEM.md. Light is the default; dark is a re-pick of
   every value against a dark surface, not an inversion. Nothing below this
   block references a raw colour.
   ======================================================================== */
:root {
  --bg: oklch(0.98 0.004 240);
  --surface: oklch(1 0 0);
  --surface-sunken: oklch(0.965 0.006 240);
  --surface-hover: oklch(0.975 0.005 240);
  --border: oklch(0.91 0.008 240);
  --border-strong: oklch(0.78 0.012 240);
  --border-control: oklch(0.62 0.014 240);

  --text: oklch(0.30 0.02 250);
  --text-secondary: oklch(0.45 0.02 250);
  --text-muted: oklch(0.52 0.018 250);

  --primary: oklch(0.50 0.075 190);
  --primary-hover: oklch(0.44 0.075 190);
  --primary-text: oklch(0.45 0.08 190);
  --primary-soft: oklch(0.95 0.02 190);
  --on-primary: oklch(1 0 0);
  --brass: oklch(0.62 0.07 75);

  --critical: oklch(0.50 0.165 18);
  --critical-text: oklch(0.46 0.15 22);
  --critical-soft: oklch(0.975 0.014 22);
  --warning: oklch(0.65 0.145 72);
  --warning-text: oklch(0.48 0.09 65);
  --warning-soft: oklch(0.98 0.022 75);
  --success: oklch(0.53 0.115 158);
  --success-text: oklch(0.47 0.09 160);
  --success-soft: oklch(0.965 0.02 160);
  --info: oklch(0.52 0.115 250);
  --info-text: oklch(0.47 0.09 245);

  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 18px;

  --elev-1: 0 1px 2px rgb(16 24 40 / 0.04);
  --elev-2: 0 4px 16px rgb(16 24 40 / 0.08);

  --dur-fast: 120ms;
  --dur-base: 180ms;
  --ease-out: cubic-bezier(0.2, 0, 0, 1);
  --z-sticky: 10;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(0.205 0.012 250);
    --surface: oklch(0.245 0.012 250);
    --surface-sunken: oklch(0.185 0.012 250);
    --surface-hover: oklch(0.275 0.012 250);
    --border: oklch(0.32 0.014 250);
    --border-strong: oklch(0.42 0.016 250);
    --border-control: oklch(0.60 0.016 250);

    --text: oklch(0.95 0.006 250);
    --text-secondary: oklch(0.80 0.01 250);
    --text-muted: oklch(0.68 0.012 250);

    --primary: oklch(0.72 0.085 185);
    --primary-hover: oklch(0.78 0.085 185);
    --primary-text: oklch(0.80 0.075 185);
    --primary-soft: oklch(0.30 0.035 190);
    --on-primary: oklch(0.18 0.02 250);
    --brass: oklch(0.76 0.075 80);

    --critical: oklch(0.62 0.16 22);
    --critical-text: oklch(0.76 0.13 22);
    --critical-soft: oklch(0.255 0.030 22);
    --warning: oklch(0.75 0.13 62);
    --warning-text: oklch(0.84 0.10 65);
    --warning-soft: oklch(0.255 0.026 65);
    --success: oklch(0.72 0.11 160);
    --success-text: oklch(0.80 0.095 160);
    --success-soft: oklch(0.255 0.026 160);
    --info: oklch(0.70 0.09 245);
    --info-text: oklch(0.80 0.08 245);

    --elev-1: none;
    --elev-2: 0 8px 24px rgb(0 0 0 / 0.35);
  }
}
:root[data-theme="dark"] {
  --bg: oklch(0.205 0.012 250);
  --surface: oklch(0.245 0.012 250);
  --surface-sunken: oklch(0.185 0.012 250);
  --surface-hover: oklch(0.275 0.012 250);
  --border: oklch(0.32 0.014 250);
  --border-strong: oklch(0.42 0.016 250);
  --border-control: oklch(0.60 0.016 250);

  --text: oklch(0.95 0.006 250);
  --text-secondary: oklch(0.80 0.01 250);
  --text-muted: oklch(0.68 0.012 250);

  --primary: oklch(0.72 0.085 185);
  --primary-hover: oklch(0.78 0.085 185);
  --primary-text: oklch(0.80 0.075 185);
  --primary-soft: oklch(0.30 0.035 190);
  --on-primary: oklch(0.18 0.02 250);
  --brass: oklch(0.76 0.075 80);

  --critical: oklch(0.62 0.16 22);
  --critical-text: oklch(0.76 0.13 22);
  --critical-soft: oklch(0.255 0.030 22);
  --warning: oklch(0.75 0.13 62);
  --warning-text: oklch(0.84 0.10 65);
  --warning-soft: oklch(0.255 0.026 65);
  --success: oklch(0.72 0.11 160);
  --success-text: oklch(0.80 0.095 160);
  --success-soft: oklch(0.255 0.026 160);
  --info: oklch(0.70 0.09 245);
  --info-text: oklch(0.80 0.08 245);

  --elev-1: none;
  --elev-2: 0 8px 24px rgb(0 0 0 / 0.35);
}

/* ============================================================ base */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.55 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: max(24px, env(safe-area-inset-bottom));
}
h1, h2, h3 { text-wrap: balance; margin: 0; font-weight: 600; letter-spacing: -0.011em; }
p { text-wrap: pretty; margin: 0; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: var(--radius-sm); }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

/* ========================================================== chrome */
header {
  position: sticky; top: 0; z-index: var(--z-sticky);
  display: flex; align-items: center; gap: 12px;
  padding: 10px 20px; padding-top: max(10px, env(safe-area-inset-top));
  background: color-mix(in oklab, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.wordmark {
  font-weight: 700; font-size: 16px; letter-spacing: 0.02em;
  color: var(--brass);
}
.who {
  color: var(--text-muted); font-size: 13px;
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.who .facility { display: none; }
@media (min-width: 600px) { .who .facility { display: inline; } }
header .spacer { margin-left: auto; }

main { max-width: 1120px; margin: 0 auto; padding: 24px 20px; }
@media (min-width: 905px) {
  main { display: grid; grid-template-columns: minmax(0, 1fr) 392px; gap: 28px; align-items: start; }
  main > .full { grid-column: 1 / -1; }
}

/* ========================================================== controls */
button {
  font: inherit; color: inherit; cursor: pointer;
  min-height: 44px; padding: 0 16px;
  border-radius: var(--radius-sm); border: 1px solid var(--border-control);
  background: var(--surface);
  transition-property: background-color, border-color, scale;
  transition-duration: var(--dur-fast);
  transition-timing-function: var(--ease-out);
}
button:hover { background: var(--surface-hover); }
button:active { scale: 0.96; }
button.primary {
  background: var(--primary); color: var(--on-primary);
  border-color: transparent; font-weight: 560;
  box-shadow: var(--elev-1);
}
button.primary:hover { background: var(--primary-hover); }
button.quiet {
  border-color: transparent; background: transparent; color: var(--text-secondary);
}
button.quiet:hover { background: var(--surface-hover); color: var(--text); }
button.sm { min-height: 36px; padding: 0 12px; font-size: 13px; }
/* 36px is fine under a mouse in dense UI; a finger needs 44. */
@media (pointer: coarse) { button.sm { min-height: 44px; min-width: 44px; } }
header button { min-width: 44px; }

input {
  font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--border-control); border-radius: var(--radius-sm);
  min-height: 44px; padding: 0 12px; width: 100%;
}
input::placeholder { color: var(--text-muted); }
label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }

/* ============================================================ pieces */
.page-title { font-size: 30px; line-height: 1.15; margin-bottom: 4px; }
.page-sub { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }

.section-title {
  font-size: 13px; font-weight: 560; color: var(--text-secondary);
  margin: 0 0 12px; display: flex; align-items: baseline; gap: 8px;
}
.section-title .count { color: var(--text-muted); font-weight: 400; }

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
@media (max-width: 420px) { .tiles { grid-template-columns: 1fr 1fr; } }
.tile {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 14px 16px; box-shadow: var(--elev-1);
}
.tile .value { font-size: 30px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.tile .label { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
.tile.is-critical .value { color: var(--critical-text); }
.tile.is-warning .value { color: var(--warning-text); }
.tile.is-stable .value { color: var(--success-text); }

/* Triage card. Urgency reads from sort position first, then the rail and the
   tint, then the written label. Colour is never the only signal. */
.card {
  position: relative; display: block; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); box-shadow: var(--elev-1);
  padding: 16px 16px 16px 19px; margin-bottom: 12px;
  overflow: hidden;
  transition: border-color var(--dur-fast) var(--ease-out);
}
.card::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--border-strong);
}
.card.is-critical { background: var(--critical-soft); }
.card.is-critical::before { background: var(--critical); }
.card.is-warning { background: var(--warning-soft); }
.card.is-warning::before { background: var(--warning); }
.card:hover { border-color: var(--border-strong); }
.card[aria-current="true"] { border-color: var(--primary); }
.card-head { display: flex; align-items: flex-start; gap: 12px; }
.card .name { font-size: 17px; font-weight: 560; line-height: 1.3; }
.card .meta { color: var(--text-secondary); font-size: 13px; margin-top: 2px; }
.card .reasons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.card .strip-wrap { margin-top: 12px; }

.avatar {
  flex: none; width: 40px; height: 40px; border-radius: 999px;
  display: grid; place-items: center;
  background: var(--primary-soft); color: var(--primary-text);
  font-size: 14px; font-weight: 600; letter-spacing: 0.01em;
}

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; line-height: 1.35; padding: 5px 10px;
  border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-secondary);
}
.pill.is-critical { color: var(--critical-text); border-color: color-mix(in oklab, var(--critical) 40%, transparent); }
.pill.is-warning { color: var(--warning-text); border-color: color-mix(in oklab, var(--warning) 45%, transparent); }
.pill svg { width: 14px; height: 14px; stroke-width: 2; flex: none; }
.section-title svg { width: 15px; height: 15px; stroke-width: 2; flex: none; }

/* Dose strip: status by colour AND shape, so it survives colour blindness
   and a photocopy. 2px gaps keep adjacent marks from reading as one bar. */
.strip { display: flex; gap: 2px; align-items: center; }
.mark { width: 10px; height: 10px; flex: none; }
.mark.taken { background: var(--success); border-radius: 999px; }
.mark.missed { background: var(--warning); border-radius: 3px; }
.mark.waiting { border: 1.5px solid var(--border-strong); border-radius: 999px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; font-size: 12px; color: var(--text-muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }

.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--elev-1);
}
.panel + .panel { margin-top: 16px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }
.row + .row { border-top: 1px solid var(--border); }
.row .lead { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row .lead .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.muted { color: var(--text-muted); font-size: 13px; }

.stat { display: flex; align-items: baseline; gap: 10px; margin: 4px 0 2px; }
.stat .value { font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .window { color: var(--text-muted); font-size: 13px; }

.detail-head { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
.detail-head .avatar { width: 48px; height: 48px; font-size: 16px; }
.detail-head h2 { font-size: 20px; line-height: 1.25; }

.empty { text-align: center; padding: 44px 20px; }
.empty .mark-ok {
  width: 44px; height: 44px; border-radius: 999px; margin: 0 auto 14px;
  background: var(--success-soft); color: var(--success-text);
  display: grid; place-items: center;
}
.empty .mark-ok svg { width: 22px; height: 22px; stroke-width: 2; }
.empty p { color: var(--text-secondary); margin-bottom: 18px; }

.sms {
  font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, monospace;
  font-size: 12px; line-height: 1.6; color: var(--text-secondary);
  background: var(--surface-sunken); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 12px; overflow-x: auto;
}
.quote {
  border-left: 2px solid var(--border-strong); padding: 2px 0 2px 12px;
  color: var(--text-secondary); font-size: 14px; margin-top: 10px;
}
.demo-note { font-size: 12px; color: var(--text-muted); border-top: 1px dashed var(--border-strong); padding-top: 16px; margin-top: 18px; }
.stack { display: grid; gap: 12px; }
.login { max-width: 380px; margin: 10vh auto; }
.login h1 { font-size: 24px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <span class="wordmark">POST</span>
  <span class="who" id="who"></span>
  <span class="spacer"></span>
  <button class="quiet sm" id="theme" aria-label="Badili mwanga">◐</button>
  <button class="quiet sm" id="lang" aria-label="Badili lugha">EN</button>
  <button class="quiet sm" id="refresh" hidden aria-label="Onyesha upya">↻</button>
</header>

<main id="app"></main>

<script type="module">
const T = {
  sw: {
    signIn: 'Ingia', phone: 'Namba ya simu', password: 'Nenosiri',
    title: 'Wagonjwa wako', needsAttention: 'Wanaohitaji msaada', upcoming: 'Ziara zijazo',
    critical: 'Hatari', warning: 'Angalia', stable: 'Wako sawa',
    empty: 'Hakuna anayehitaji msaada sasa.', addPatient: 'Ongeza mgonjwa',
    adherence: 'Unywaji wa dawa', window: 'siku 7 zilizopita',
    doses: 'Dozi za karibuni', messages: 'Ujumbe wake',
    resolve: 'Imeshughulikiwa', waiting: 'tangu', alerts: 'Tahadhari',
    selectPatient: 'Chagua mgonjwa kuona historia yake.',
    outbox: 'SMS zilizotumwa', simulate: 'Jibu kama mgonjwa', send: 'Tuma',
    runTick: 'Endesha vikumbusho', taken: 'amekunywa', missed: 'hakunywa', open: 'inasubiri',
    noDoses: 'Hakuna dozi bado.', demo: 'Vidhibiti vya onyesho — havipo kwenye toleo halisi.',
    signInFailed: 'Namba au nenosiri si sahihi.', today: 'Leo',
  },
  en: {
    signIn: 'Sign in', phone: 'Phone number', password: 'Password',
    title: 'Your patients', needsAttention: 'Needs attention', upcoming: 'Upcoming visits',
    critical: 'Critical', warning: 'Attention', stable: 'Stable',
    empty: 'No one needs attention right now.', addPatient: 'Add patient',
    adherence: 'Adherence', window: 'last 7 days',
    doses: 'Recent doses', messages: 'Their messages',
    resolve: 'Handled', waiting: 'since', alerts: 'Alerts',
    selectPatient: 'Select a patient to see their history.',
    outbox: 'Sent SMS', simulate: 'Reply as patient', send: 'Send',
    runTick: 'Run reminders', taken: 'taken', missed: 'missed', open: 'waiting',
    noDoses: 'No doses yet.', demo: 'Demo controls — not part of the real product.',
    signInFailed: 'Wrong number or password.', today: 'Today',
  },
};

const ALERT_LABELS = {
  red_flag_symptom: { sw: 'Dalili ya hatari', en: 'Red flag symptom', icon: 'alert-triangle' },
  missed_meds:      { sw: 'Dawa haikunywewa', en: 'Missed meds',      icon: 'clock-alert' },
  missed_visit:     { sw: 'Hakuja kliniki',   en: 'Missed visit',     icon: 'clock-alert' },
  unreachable:      { sw: 'Hapatikani',       en: 'Unreachable',      icon: 'signal-off' },
  unparsed_reply:   { sw: 'Ujumbe mpya',      en: 'New message',      icon: 'message' },
  opted_out:        { sw: 'Amejitoa',         en: 'Opted out',        icon: 'signal-off' },
};
const ICONS = {
  'alert-triangle': '<path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4"/><path d="M12 17.5v.5"/>',
  'clock-alert': '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  'signal-off': '<path d="M3 20h18"/><path d="M6 20v-4"/><path d="M12 20V9"/><path d="m3 3 18 18"/>',
  'message': '<path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2Z"/>',
  'calendar': '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/>',
  'check': '<path d="m5 13 4 4L19 7"/>',
};
const icon = (name) =>
  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">${ICONS[name] ?? ICONS['alert-triangle']}</svg>`;

let lang = localStorage.getItem('post.lang') ?? 'sw';
let theme = localStorage.getItem('post.theme') ?? '';
let token = localStorage.getItem('post.token') ?? '';
let selected = null;
const app = document.getElementById('app');
const t = () => T[lang];

const api = async (path, options = {}) => {
  const res = await fetch(`/api${path}`, {
    ...options,
    headers: {
      'content-type': 'application/json',
      ...(token ? { authorization: `Bearer ${token}` } : {}),
      ...options.headers,
    },
  });
  if (res.status === 401) { token = ''; localStorage.removeItem('post.token'); renderLogin(); throw new Error('unauthorised'); }
  return res.json();
};

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const initials = (name) => String(name).trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
const since = (iso) => {
  const mins = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  const unit = lang === 'sw' ? { m: 'dk', h: 'saa', d: 'siku' } : { m: 'min', h: 'h', d: 'd' };
  if (mins < 60) return `${mins} ${unit.m}`;
  if (mins < 1440) return `${Math.round(mins / 60)} ${unit.h}`;
  return `${Math.round(mins / 1440)} ${unit.d}`;
};
// A dose promised at 08:00 must read 08:00 wherever the doctor opens the
// dashboard, so every timestamp is formatted in the patient's timezone.
const clock = (iso, timezone) => new Date(iso).toLocaleString(lang === 'sw' ? 'sw-TZ' : 'en-GB',
  { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit',
    timeZone: timezone || 'Africa/Dar_es_Salaam' });
const day = (isoDate) => {
  const [y, m, d] = String(isoDate).split('-');
  return `${d}/${m}/${y.slice(2)}`;
};
const doseStrip = (marks, withLegend = false) => {
  if (!marks || marks.length === 0) return '';
  const label = `${t().doses}: ${marks.filter((m) => m === 'taken').length}/${marks.filter((m) => m !== 'waiting').length} ${t().taken}`;
  return `
    <div class="strip-wrap">
      <div class="strip" role="img" aria-label="${esc(label)}">
        ${marks.map((m) => `<span class="mark ${m}"></span>`).join('')}
      </div>
      ${withLegend ? `
      <div class="legend">
        <span><span class="mark taken"></span>${t().taken}</span>
        <span><span class="mark missed"></span>${t().missed}</span>
        <span><span class="mark waiting"></span>${t().open}</span>
      </div>` : ''}
    </div>`;
};

/* ------------------------------------------------------------------ login */
function renderLogin() {
  document.getElementById('who').textContent = '';
  document.getElementById('refresh').hidden = true;
  app.innerHTML = `
    <form class="panel login stack" id="form">
      <h1>${t().signIn}</h1>
      <div>
        <label for="phone">${t().phone}</label>
        <input id="phone" name="phone" inputmode="tel" value="+255700000001" autocomplete="username">
      </div>
      <div>
        <label for="password">${t().password}</label>
        <input id="password" name="password" type="password" value="post-demo-1234" autocomplete="current-password">
      </div>
      <button class="primary" type="submit">${t().signIn}</button>
      <p class="muted" id="error" role="alert" aria-live="polite"></p>
    </form>`;
  document.getElementById('form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const res = await api('/auth/login', {
      method: 'POST',
      body: JSON.stringify({ phone: phone.value, password: password.value }),
    });
    if (!res.token) { document.getElementById('error').textContent = t().signInFailed; return; }
    token = res.token;
    localStorage.setItem('post.token', token);
    renderDashboard();
  });
}

/* -------------------------------------------------------------- dashboard */
async function renderDashboard() {
  document.getElementById('refresh').hidden = false;
  const [me, triage] = await Promise.all([api('/auth/me'), api('/triage')]);
  document.getElementById('who').innerHTML = me.doctor
    ? `${lang === 'sw' ? 'Dkt' : 'Dr'} ${esc(me.doctor.name)}` +
      (me.doctor.facility ? `<span class="facility"> · ${esc(me.doctor.facility)}</span>` : '')
    : '';

  const c = triage.counts;
  const dateLabel = new Date().toLocaleDateString(lang === 'sw' ? 'sw-TZ' : 'en-GB',
    { weekday: 'long', day: 'numeric', month: 'long' });

  const list = triage.needs_attention.length === 0
    ? `<div class="panel empty">
         <div class="mark-ok">${icon('check')}</div>
         <p>${t().empty}</p>
         <button class="primary">${t().addPatient}</button>
       </div>`
    : triage.needs_attention.map((entry) => `
      <button class="card is-${entry.severity}" data-patient="${entry.patient.id}"
              aria-current="${selected === entry.patient.id}">
        <div class="card-head">
          <span class="avatar" aria-hidden="true">${esc(initials(entry.patient.name))}</span>
          <span style="min-width:0">
            <span class="name">${esc(entry.patient.name)}</span>
            <div class="meta">${esc(entry.patient.diagnosis)} · ${t().waiting} ${since(entry.waiting_since)}</div>
          </span>
        </div>
        <div class="reasons">
          ${entry.reasons.map((r) => `
            <span class="pill is-${r.severity}">${icon(r.icon)}${esc(lang === 'sw' ? r.label_sw : r.label_en)}</span>
          `).join('')}
        </div>
        ${doseStrip(entry.dose_strip)}
      </button>`).join('');

  const visits = triage.upcoming_visits.length === 0 ? '' : `
    <div class="panel" style="margin-top:24px">
      <h2 class="section-title">${icon('calendar')}&nbsp;${t().upcoming}</h2>
      ${triage.upcoming_visits.map((v) => `
        <div class="row">
          <div class="lead">
            <span class="avatar" style="width:32px;height:32px;font-size:12px" aria-hidden="true">${esc(initials(v.name))}</span>
            <span style="min-width:0">
              <div class="name">${esc(v.name)}</div>
              <div class="muted">${esc(v.location)}</div>
            </span>
          </div>
          <div class="muted num">${day(v.visit_date)}</div>
        </div>`).join('')}
    </div>`;

  app.innerHTML = `
    <section>
      <h1 class="page-title">${t().title}</h1>
      <p class="page-sub">${esc(dateLabel)}</p>
      <div class="tiles">
        <div class="tile is-critical"><div class="value num">${c.critical}</div><div class="label">${t().critical}</div></div>
        <div class="tile is-warning"><div class="value num">${c.warning}</div><div class="label">${t().warning}</div></div>
        <div class="tile is-stable"><div class="value num">${c.stable}</div><div class="label">${t().stable}</div></div>
      </div>
      <h2 class="section-title">${t().needsAttention}
        <span class="count num">${triage.needs_attention.length}</span></h2>
      ${list}
      ${visits}
    </section>
    <aside id="detail" class="panel"><p class="muted">${t().selectPatient}</p></aside>
    <section class="full" id="demo"></section>`;

  for (const card of app.querySelectorAll('[data-patient]')) {
    card.addEventListener('click', () => selectPatient(card.dataset.patient));
  }
  if (selected) selectPatient(selected);
  renderDemoControls();
}

async function selectPatient(id) {
  selected = id;
  for (const card of app.querySelectorAll('[data-patient]')) {
    card.setAttribute('aria-current', String(card.dataset.patient === id));
  }
  const data = await api(`/patients/${id}`);
  const rate = data.adherence.adherenceRate;
  const marks = [...data.doses].reverse()
    .map((d) => (d.taken === true ? 'taken' : d.taken === false ? 'missed' : 'waiting'))
    .slice(-14);

  document.getElementById('detail').innerHTML = `
    <div class="detail-head">
      <span class="avatar" aria-hidden="true">${esc(initials(data.patient.name))}</span>
      <span style="min-width:0">
        <h2>${esc(data.patient.name)}</h2>
        <div class="muted">${esc(data.patient.diagnosis)}</div>
        <div class="muted num">${esc(data.patient.phone)}</div>
      </span>
    </div>

    <h3 class="section-title">${t().adherence}</h3>
    <div class="stat">
      <span class="value">${rate === null ? '—' : `${Math.round(rate * 100)}%`}</span>
      <span class="window">${t().window}</span>
    </div>
    ${doseStrip(marks, true)}

    <h3 class="section-title" style="margin-top:24px">${t().doses}</h3>
    ${data.doses.length === 0 ? `<p class="muted">${t().noDoses}</p>` : data.doses.slice(0, 6).map((d) => `
      <div class="row">
        <span class="lead">
          <span class="mark ${d.taken === true ? 'taken' : d.taken === false ? 'missed' : 'waiting'}"></span>
          <span>${esc(d.medication)}</span>
        </span>
        <span class="muted num">${clock(d.scheduled_for, data.patient.timezone)} · ${
          d.taken === true ? t().taken : d.taken === false ? t().missed : t().open}</span>
      </div>`).join('')}

    ${(() => {
      const open = data.alerts.filter((a) => !a.resolved);
      return open.length === 0 ? '' : `<h3 class="section-title" style="margin-top:24px">${t().alerts}</h3>`;
    })()}
    ${data.alerts.filter((a) => !a.resolved).map((a) => `
      <div class="row">
        <span class="pill is-${a.severity}">${icon(ALERT_LABELS[a.type]?.icon)}${
          esc(ALERT_LABELS[a.type] ? ALERT_LABELS[a.type][lang] : a.type)}</span>
        <button class="sm" data-resolve="${a.id}">${t().resolve}</button>
      </div>`).join('')}

    ${(() => {
      // Their own words, not their reply codes: a "1" is adherence data, a
      // sentence is the patient telling their doctor something.
      const said = (data.inbound ?? []).filter((m) => m.parsed_code === null);
      if (said.length === 0) return '';
      return `<h3 class="section-title" style="margin-top:24px">${t().messages}</h3>` +
        said.slice(0, 3).map((m) => `
          <div class="quote">${esc(m.body)}
            <div class="muted num" style="margin-top:4px">${clock(m.received_at, data.patient.timezone)}</div>
          </div>`).join('');
    })()}`;

  for (const button of document.querySelectorAll('[data-resolve]')) {
    button.addEventListener('click', async () => {
      await api(`/triage/alerts/${button.dataset.resolve}/resolve`, { method: 'POST' });
      renderDashboard();
    });
  }
}

/* Demo-only: drive the loop from the browser. Mounted with POST_DEMO=1. */
async function renderDemoControls() {
  const box = document.getElementById('demo');
  if (!box) return;
  const outbox = await api('/dev/outbox').catch(() => null);
  if (!outbox) return;

  box.innerHTML = `
    <div class="panel" style="margin-top:24px">
      <h2 class="section-title">${t().outbox} <span class="count">${esc(outbox.gateway)}</span></h2>
      ${outbox.messages.slice(0, 5).map((m) => `
        <div class="sms" style="margin-bottom:8px">
          <div class="muted num">${esc(m.to_phone)} · ${esc(m.status)} · ${
            m.sent_at ? clock(m.sent_at, m.timezone) : clock(m.scheduled_for, m.timezone)}</div>
          ${esc(m.body)}
        </div>`).join('')}
      <div class="demo-note">
        <p style="margin-bottom:12px">${t().demo}</p>
        <div class="stack" style="grid-template-columns: 1fr 1fr auto; align-items:end">
          <div><label for="from">${t().simulate}</label>
            <input id="from" value="${esc(outbox.messages[0]?.to_phone ?? '')}"></div>
          <div><label for="text">SMS</label><input id="text" value="1"></div>
          <button class="sm" id="reply">${t().send}</button>
        </div>
        <button class="sm" id="tick" style="margin-top:12px">${t().runTick}</button>
      </div>
    </div>`;

  document.getElementById('reply').addEventListener('click', async () => {
    await fetch('/api/webhooks/sms/inbound', {
      method: 'POST',
      headers: { 'content-type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ from: from.value, text: text.value, id: `ui-${Date.now()}` }),
    });
    renderDashboard();
  });
  document.getElementById('tick').addEventListener('click', async () => {
    await api('/dev/tick', { method: 'POST', body: '{}' });
    renderDashboard();
  });
}

/* ------------------------------------------------------------- app chrome */
function applyTheme() {
  if (theme) document.documentElement.setAttribute('data-theme', theme);
  else document.documentElement.removeAttribute('data-theme');
  document.getElementById('theme').textContent = theme === 'dark' ? '☾' : theme === 'light' ? '☀' : '◐';
}
document.getElementById('theme').addEventListener('click', () => {
  theme = theme === '' ? 'light' : theme === 'light' ? 'dark' : '';
  theme ? localStorage.setItem('post.theme', theme) : localStorage.removeItem('post.theme');
  applyTheme();
});
document.getElementById('lang').addEventListener('click', () => {
  lang = lang === 'sw' ? 'en' : 'sw';
  localStorage.setItem('post.lang', lang);
  document.documentElement.lang = lang;
  document.getElementById('lang').textContent = lang === 'sw' ? 'EN' : 'SW';
  token ? renderDashboard() : renderLogin();
});
document.getElementById('refresh').addEventListener('click', () => renderDashboard());
document.getElementById('lang').textContent = lang === 'sw' ? 'EN' : 'SW';
document.documentElement.lang = lang;
applyTheme();

token ? renderDashboard().catch(renderLogin) : renderLogin();
</script>
</body>
</html>
